name: ci

on:
  push:
    branches:
      - "master"

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: cloud
          endpoint: "viinex/vnxbuilder"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: viinex/vnx-class

      - name: Get latest commit hash of viinex-demo-ui
        id: demo-ui-rev
        run: |
          # Fetches the commit hash of the HEAD (default branch) of the remote repository
          # and sets it as a step output variable named 'sha'.
          echo "sha=$(git ls-remote https://github.com/viinex/viinex-demo-ui.git HEAD | cut -f1)" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          build-args: CACHE_BUSTER=${{ steps.demo-ui-rev.outputs.sha }}
          tags: "${{ vars.DOCKER_USER }}/vnx-class:latest"
          provenance: mode=max
          sbom: true
          #push: true?
          # For pull requests, export results to the build cache.
          # Otherwise, push to a registry.
          outputs: ${{ github.event_name == 'pull_request' && 'type=cacheonly' || 'type=registry' }}
  
